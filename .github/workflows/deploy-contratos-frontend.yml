name: Deploy frontend (Firebase Hosting)

on:
  push:
    branches:
      - aHernandez_main-qualitas-prod
    paths:
      - 'src/**'
      - 'angular.json'
      - 'package.json'
      - 'deploy-contratos-frontend.sh'
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente destino"
        required: true
        type: choice
        options: [dev, qa, prod]

concurrency:
  group: contratos-frontend-${{ inputs.environment || 'prod' }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || (github.ref_name == 'aHernandez_main-qualitas-prod' && 'prod' || 'qa') }}
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      AUTH_USUARIO: ${{ secrets.AUTH_USUARIO }}
      AUTH_CONTRASENA: ${{ secrets.AUTH_CONTRASENA }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/204196621624/locations/global/workloadIdentityPools/github-pool-prod/providers/github-provider
          service_account: firebase-hosting-deployer@qlts-pro-mx-au-ia-agentes.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Desplegar con deploy.sh
        run: bash ./deploy-contratos-frontend.sh